name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Android SDK packages are installed
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.2/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]]; then
            sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, lint, and run unit tests
        run: ./gradlew --no-daemon build lint testDebugUnitTest
