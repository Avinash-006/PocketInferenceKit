name: Bug report
description: Report a reproducible problem in the Android SDK or sample
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: SDK version, Android device and version, model revision, and backend
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs with credentials and private prompts removed
