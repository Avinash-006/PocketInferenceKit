name: Feature request
description: Propose a change to the SDK, catalog, or sample
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior and how to verify it
    validations:
      required: true
