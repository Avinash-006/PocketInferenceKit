[versions]
agp = "9.5.2"
kotlin = "2.4.21"
litert-lm = "0.19.1"
coroutines = "1.11.0"
workmanager = "2.12.0"
mockwebserver = "5.5.1"
junit = "4.13.2"
android-compile = "37"
android-compile-minor = "2"
android-min = "24"
android-target = "37"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
litert-lm = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litert-lm" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
workmanager = { module = "androidx.work:work-runtime", version.ref = "workmanager" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "mockwebserver" }
